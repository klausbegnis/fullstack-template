version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      - dependency-name: python
        update-types:
          - version-update:semver-minor
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns:
          - "*"
  - package-ecosystem: docker-compose
    directory: /
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-python:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /frontend
    ignore:
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: eslint-config-next
        update-types:
          - version-update:semver-major
    schedule:
      interval: weekly
    groups:
      frontend-npm:
        patterns:
          - "*"
