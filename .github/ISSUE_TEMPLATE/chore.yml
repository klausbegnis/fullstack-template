name: Chore
description: Propose maintenance work with no behaviour change
title: "[Chore] "
labels: [chore, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Use this for maintenance that does not change observable behaviour: version
        bumps, refactors, tooling, or cleanup. If it changes behaviour, use the
        Feature or Bug form instead.
  - type: textarea
    id: what-is-it
    attributes:
      label: What is it
      description: One or two sentences describing the maintenance work.
      placeholder: Upgrade FastAPI from 0.141.1 to 0.142.0 and re-run the full backend suite.
    validations:
      required: true
  - type: textarea
    id: specs
    attributes:
      label: Specs
      description: >-
        The concrete work: what changes, what stays the same, and how to confirm
        nothing observable moved.
      placeholder: |
        - Bump `fastapi` in `backend/pyproject.toml`, run `uv sync`.
        - No route, schema, or dependency-injection signature changes expected.
        - `uv run pytest`, `uv run mypy app`, and `uv run python -m
          app.commands.export_openapi` must produce an unchanged `openapi.json`.
    validations:
      required: true
  - type: textarea
    id: pre-exploration
    attributes:
      label: Pre-exploration
      description: >-
        The head start an implementing agent gets: known files, prior art,
        constraints already discovered, and open questions. Filled in during
        grooming so the agent does not have to rediscover it.
      placeholder: |
        - Changelog for 0.142.0 flags a deprecation in `Depends()` caching; grep
          `app/dependencies/` for the affected pattern before bumping.
        - Prior art: the SQLAlchemy 2.0.54 bump in PR #14 used the same
          sync-then-full-suite approach.
    validations:
      required: false
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: A testable checklist. Each line should be verifiable by a specific test or manual step.
      placeholder: |
        - [ ] `uv run pytest` passes with no new skips.
        - [ ] `uv run mypy app` reports no new errors.
        - [ ] `backend/openapi.json` diff is empty against `main`.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this issue explicitly does not cover, so an agent does not scope-creep into it.
      placeholder: Upgrading pydantic in the same pass; that is a separate chore.
    validations:
      required: false
  - type: input
    id: related-documents
    attributes:
      label: Related documents
      description: Repo-relative path to any PRD or spec this chore supports, if any.
      placeholder: docs/prds/0001-user-management.md
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the stack this chore touches. Pick every area it spans.
      multiple: true
      options:
        - backend
        - frontend
        - full-stack
        - devops
        - security
    validations:
      required: true
