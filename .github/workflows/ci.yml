name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app
      AUTH_JWT_SECRET: github-actions-insecure-secret-value-32b
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy app

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Verify migrations are in sync with models
        run: uv run alembic check

      - name: Test
        run: uv run pytest

      - name: Verify the committed OpenAPI contract is current
        run: |
          uv run python -m app.commands.export_openapi
          git diff --exit-code -- openapi.json

  harness:
    name: Harness
    runs-on: ubuntu-latest
    env:
      AUTH_JWT_SECRET: github-actions-insecure-secret-value-32b
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Test the task environment helper
        run: python3 .agents/skills/task/scripts/test_task_env.py

      - name: Test the hook scripts
        run: python3 .agents/hooks/test_hooks.py

      - name: Scaffold validator tests
        run: python3 .agents/scaffold/test_validate_scaffold.py

      - name: Architecture and harness contracts
        run: uv sync --locked && uv run pytest tests/unit/architecture -q
        working-directory: backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
