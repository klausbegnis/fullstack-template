[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests (fast, isolated, no external dependencies)
    integration: Integration tests (API endpoints, database, external services)
    slow: Slow running tests

addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

[coverage:run]
source = app
omit =
    */tests/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
